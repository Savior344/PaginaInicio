<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .contenedor {
      width: 75vw;
      height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .texto {
      font-family: "Times New Roman", Times, serif;
      color: #fff;
      text-transform: uppercase;
      font-size: clamp(2rem, 10vw, 8rem);
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="texto">Hola</div>
  </div>
</body>
</html>
